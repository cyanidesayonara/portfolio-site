name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - LICENSE
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Run headless smoke tests
        run: npm run test:smoke

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No co-author or tool attribution in any commit
        run: |
          found="$(git log --format='%H%n%B' 87ef5859e60706db81d839902ee6d7eba4672b10..HEAD | grep -niE '^(co-authored-by|generated-by|assisted-by|made-with):|cursoragent@|noreply@anthropic|generated with \[?claude' || true)"
          if [ -n "$found" ]; then
            echo "Attribution trailers are not allowed in this repo:"
            git log --format='%h %s' -i -E --grep='^(co-authored-by|generated-by|assisted-by|made-with):|cursoragent@|noreply@anthropic|generated with \[?claude' 87ef5859e60706db81d839902ee6d7eba4672b10..HEAD
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, attribution]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
